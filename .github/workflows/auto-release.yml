name: Auto-release on labeled merge to master

# Cuts a release only when a merged PR has exactly one explicit release label.
# It bumps the version, commits and pushes the tag, then explicitly dispatches
# release.yml (with `ref` set to that tag) to do the actual build.
#
# Confirmed live: pushing the tag alone does NOT work. GitHub deliberately
# does not fire other workflows' `push` triggers from a push made with the
# default GITHUB_TOKEN (anti-recursion guard) — the tag lands on the repo
# fine, but release.yml's `push: tags:` trigger never sees it. Explicitly
# dispatching via `gh workflow run` sidesteps that: workflow_dispatch is a
# direct API call, not a push event, so the same-token restriction doesn't
# apply, and passing `--ref <tag>` makes `github.ref`/`ref_name` resolve to
# the real tag inside that run (not the branch release.yml would otherwise
# assume for a workflow_dispatch trigger).
#
# Triggered on `pull_request_target: closed` rather than `pull_request` so a
# merged PR from a fork still receives the base repository's write token. The
# workflow only checks out merged `master`; it never checks out or executes the
# untrusted PR head. Using a PR event rather than `push` also prevents this
# workflow's own version commit from re-triggering it.
on:
  pull_request_target:
    types: [closed]
    branches:
      - master

permissions:
  contents: write
  # Required to call `gh workflow run` (the workflow-dispatch REST
  # endpoint needs actions:write, not contents:write).
  actions: write

jobs:
  select-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      type: ${{ steps.release.outputs.type }}

    steps:
      - name: Validate release labels
        id: release
        shell: bash
        env:
          HAS_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'release:skip') }}
          HAS_PATCH: ${{ contains(github.event.pull_request.labels.*.name, 'release:patch') }}
          HAS_MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}
          HAS_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
        run: |
          release_count=0
          release_type=""

          if [[ "$HAS_PATCH" == "true" ]]; then
            release_count=$((release_count + 1))
            release_type="patch"
          fi
          if [[ "$HAS_MINOR" == "true" ]]; then
            release_count=$((release_count + 1))
            release_type="minor"
          fi
          if [[ "$HAS_MAJOR" == "true" ]]; then
            release_count=$((release_count + 1))
            release_type="major"
          fi

          if [[ "$release_count" -gt 1 ]]; then
            echo "::error::A PR may have only one release label"
            exit 1
          fi
          if [[ "$HAS_SKIP" == "true" && "$release_count" -gt 0 ]]; then
            echo "::error::release:skip cannot be combined with a release label"
            exit 1
          fi

          if [[ "$release_count" -eq 1 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "type=$release_type" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "type=" >> "$GITHUB_OUTPUT"
          fi

  auto-release:
    needs: select-release
    if: needs.select-release.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: d2mxlutils-auto-release
      cancel-in-progress: false
    env:
      HUSKY: 0

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: version
        run: |
          pnpm release ${{ needs.select-release.outputs.type }}
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Push the tag explicitly by name rather than `--follow-tags` — a
      # bulk multi-tag push (e.g. a fresh clone missing older historical
      # tags) has been observed to not reliably fire the tag-push trigger
      # on this repo; pushing exactly one new tag does. (Moot for the
      # trigger itself now — see the next step — but still the right way
      # to push a single specific tag regardless.)
      - name: Push version bump and tag atomically
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git push --atomic origin master "refs/tags/$tag:refs/tags/$tag"

      # See the top-of-file note: the push above cannot fire release.yml's
      # own trigger (default-GITHUB_TOKEN pushes don't cascade to other
      # workflows), so kick off the actual build explicitly instead.
      - name: Trigger release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo ${{ github.repository }} \
            --ref ${{ steps.version.outputs.tag }} \
            -f target=both
